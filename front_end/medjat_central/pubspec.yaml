name: medjat_central
description: "Medjat Central — HR Attendance & Payroll Management App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  get: ^4.7.2

  firebase_core: ^3.8.0
  firebase_auth: ^5.3.0
  firebase_messaging: ^15.2.0
  firebase_analytics: ^11.4.0
  firebase_crashlytics: ^4.3.0
  firebase_remote_config: ^5.4.0

  google_sign_in: ^7.2.0

  flutter_dotenv: ^5.2.1
  flutter_secure_storage: ^9.2.4
  flutter_screenutil: ^5.9.3
  shared_preferences: ^2.3.4
  get_storage: ^2.1.1

  http: ^1.2.2
  connectivity_plus: ^6.1.4
  permission_handler: ^11.3.1

  lottie: ^3.3.1
  url_launcher: ^6.3.1
  app_links: ^6.3.3
  intl: ^0.20.2
  package_info_plus: ^8.1.3
  in_app_update: ^4.2.5
  upgrader: ^12.3.0
  qr_flutter: ^4.1.0
  file_picker: ^8.1.0
  pdf: ^3.11.3
  printing: ^5.14.2
  open_filex: ^4.5.0
  path_provider: ^2.1.5
  country_picker: ^2.0.27
  flutter_local_notifications: ^22.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/fonts/
    - assets/images/
    - assets/lottie/

  fonts:
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700

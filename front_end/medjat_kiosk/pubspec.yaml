name: medjat_kiosk
description: "Medjat branch kiosk — shared tablet attendance"
publish_to: 'none'
version: 1.0.0+1

environment:
  # Kept in step with medjat_app and medjat_shared.
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Face pipeline + the MobileFaceNet model, shared with medjat_app.
  # The server matches embeddings from both products against one stored vector
  # per employee, so extraction must be identical. One copy, not two.
  medjat_shared:
    path: ../packages/medjat_shared

  # Version constraints deliberately match medjat_app.
  get: ^4.7.2
  http: ^1.2.2
  connectivity_plus: ^6.1.4
  flutter_dotenv: ^5.2.1
  flutter_secure_storage: ^9.2.4
  flutter_screenutil: ^5.9.3

  camera: ^0.11.0+2
  google_mlkit_face_detection: ^0.13.1

  # Device model and Android version, reported once at pairing.
  device_info_plus: ^11.2.0

  # Reports the running version on every heartbeat; the server compares it
  # against medjat_kiosk_min_version and answers 426 when it is too old.
  package_info_plus: ^8.1.2

  cupertino_icons: ^1.0.8

  # Deliberately ABSENT:
  #
  #   firebase_*        The version gate and the maintenance switch are enforced
  #                     server-side: the kiosk reports its version on every
  #                     heartbeat and the backend answers 426/503 after reading
  #                     Remote Config itself. Putting the SDK on the tablet
  #                     would add a google-services.json step and an FCM
  #                     dependency to buy nothing the heartbeat does not already
  #                     deliver.
  #   hive              There is no offline queue. Identification requires the
  #                     server, so there is nothing to queue.
  #   google_mobile_ads A shared branch tablet shows nobody's personal content
  #                     and must not carry a surface an employee can tap out of.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env

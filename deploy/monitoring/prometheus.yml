global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:9093']

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9091']

  - job_name: node
    static_configs:
      - targets: ['127.0.0.1:9100']

  # ── Availability probes ────────────────────────────────────────────────────
  # Each job pins one blackbox module, because "healthy" differs per surface:
  # the API answers 401 without an app key, the web app 307s to /login.
  #
  # The relabel dance is the standard blackbox pattern: the scrape target is the
  # URL to probe, but the request must go to the exporter with that URL as a
  # query parameter — and `instance` is rewritten back to the URL so alerts name
  # the site, not the exporter.

  - job_name: blackbox-api
    metrics_path: /probe
    params:
      module: [api_401]
    scrape_interval: 30s
    static_configs:
      - targets: ['https://api.permedjat.com/backend/api/app/auth/login.php']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

  # Same endpoint, straight at nginx on this box. The pair separates "the
  # server is broken" from "the path to it is broken".
  - job_name: blackbox-api-origin
    metrics_path: /probe
    params:
      module: [api_401_origin]
    scrape_interval: 30s
    static_configs:
      - targets: ['http://127.0.0.1/backend/api/app/auth/login.php']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

  - job_name: blackbox-web
    metrics_path: /probe
    params:
      module: [web_up]
    scrape_interval: 30s
    static_configs:
      - targets: ['https://app.permedjat.com/']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

  - job_name: blackbox-promo
    metrics_path: /probe
    params:
      module: [http_200]
    scrape_interval: 60s
    static_configs:
      - targets: ['https://permedjat.com/']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

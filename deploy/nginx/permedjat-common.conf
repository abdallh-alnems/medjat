# Shared body for the Permedjat API server blocks (HTTP + HTTPS).
# Deploy to /etc/nginx/snippets/permedjat-common.conf
root /var/www/permedjat;
index index.php index.html;

client_max_body_size 40m;

# Security headers (mirror the old .htaccess)
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# gzip
gzip on;
gzip_vary on;
gzip_min_length 512;
gzip_types application/json application/javascript text/css text/plain text/xml image/svg+xml;

# App/Universal-link association files for the *management* app, which declares
# api.permedjatapp.com. These are exact-match locations so they outrank the regex
# deny rules below — the blanket "*.json" rule would otherwise return 403 for
# assetlinks.json and silently break App Links verification.
# The employee app declares permedjatapp.com and is served from the promo vhost.
location = /.well-known/assetlinks.json {
    default_type application/json;
    alias /var/www/permedjat/backend/.well-known/assetlinks-central.json;
}
location = /.well-known/apple-app-site-association {
    default_type application/json;
    alias /var/www/permedjat/backend/.well-known/apple-app-site-association-central;
}

# Deny hidden + sensitive files (precede the PHP handler)
location ~ /\.(?!well-known) { deny all; }

# Employee evidence — payslips, identity documents, face and punch captures.
# Everything under uploads/ is served only through an authenticated PHP endpoint
# (documents/view.php, payroll/get_slip_pdf.php, attendance/punch_photo.php, ...).
# ^~ also beats the \.php$ block, so an uploaded script is never executed, and it
# beats the legacy-path rewrite below so the old URL cannot slip past this.
location ^~ /backend/uploads/         { deny all; }
location ^~ /backend_medjet/uploads/  { deny all; }

# ---------------------------------------------------------------------------
# Everything the public must never read.
#
# ANCHORED to the deployment root on purpose. The previous rule matched these
# names anywhere in the path, which meant adding "cron" to it would also have
# blocked api/app/cron/*.php — the three HTTP cron endpoints — and silently
# stopped absence catch-up, daily alerts and kiosk capture purging. Anchoring
# makes "cron" mean the CLI directory at the root and nothing else.
#
# backend_medjet is the pre-rename root; app builds already in the stores still
# call it, so it is matched here too rather than relying on the rewrite below
# landing on a non-existent file.
#
# A miss here exposes config/env.php, and with it the database password,
# JWT_SECRET and OTP_HMAC_SECRET. deploy.sh asserts this rule on every deploy.
# ---------------------------------------------------------------------------
location ~* ^/backend(_medjet)?/(config|core|database|cron|tools|tests|lang|vendor|cache_system|models|migrations|seeds|scripts)/ {
    deny all;
}

# ---------------------------------------------------------------------------
# Legacy paths — permanent, not transitional.
#
# API_HOST is compiled into the Flutter bundle, so every permedjat_app and
# permedjat_central install already published to Google Play, the App Store and
# AppGallery asks for /backend_medjet/... and always will. These rewrites are
# what keeps those installs working; they cannot be removed on a timetable.
#
# Regex (not ^~) so the deny rules above, which are also regex and appear
# earlier, still win. join_team.php sits at the backend root while every
# endpoint moved under api/, so it needs its own line first.
# ---------------------------------------------------------------------------
location ~ ^/backend_medjet/(join\.php|join_team\.php|well_known\.php) {
    rewrite ^/backend_medjet/(.*)$ /backend/$1 last;
}
location ~ ^/backend_medjet/ {
    rewrite ^/backend_medjet/(.*)$ /backend/api/$1 last;
}

location ~* \.(env|log|sql|bak|inc|sh|conf|ini|dist|lock|md)$ { deny all; }
location ~* \.json$ { deny all; }

# PHP handler
location ~ \.php$ {
    try_files $uri =404;
    fastcgi_pass unix:/run/php/php8.5-fpm.sock;
    fastcgi_index index.php;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    fastcgi_param HTTPS $https if_not_empty;
    fastcgi_read_timeout 120s;
}

location / { try_files $uri $uri/ =404; }
location = /favicon.ico { access_log off; log_not_found off; }
location = /robots.txt  { access_log off; log_not_found off; }

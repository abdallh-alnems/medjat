# Next.js app (permedjat_central_web) — app.permedjat.com
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.permedjat.com;
    ssl_certificate     /etc/ssl/certs/permedjat-wildcard-origin.pem;
    ssl_certificate_key /etc/ssl/private/permedjat-wildcard-origin.key;
    client_max_body_size 25m;

    location / {
        # Coarse flood protection on the real client address (see
        # conf.d/permedjat-web-zone.conf for why this lives here and not in PHP).
        limit_req zone=permedjat_web burst=40 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}

# Promo / landing site — permedjat.com + www
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name permedjat.com www.permedjat.com;
    ssl_certificate     /etc/ssl/certs/permedjat-wildcard-origin.pem;
    ssl_certificate_key /etc/ssl/private/permedjat-wildcard-origin.key;

    root /var/www/permedjat-web/promo;
    index index.html;

    # App/Universal-link association files (served from backend copies)
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        alias /var/www/permedjat/backend/.well-known/apple-app-site-association;
    }
    location = /.well-known/assetlinks.json {
        default_type application/json;
        alias /var/www/permedjat/backend/.well-known/assetlinks.json;
    }

    # Employee join fallback page (PHP) + its stylesheet
    location = /join {
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/permedjat/backend/join.php;
        fastcgi_param SCRIPT_NAME /join;
    }
    location = /public/join.css {
        alias /var/www/permedjat/backend/public/join.css;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

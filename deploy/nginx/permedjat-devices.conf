# Permedjat attendance terminals — plain HTTP on a dedicated port, direct to the
# origin (NOT through Cloudflare).
#
# Deploy to /etc/nginx/sites-available/permedjat-devices and symlink into
# sites-enabled. Also: ufw allow 8090/tcp
#
# Why not the main api.permedjatapp.com vhost:
#   - ZK firmware speaks weak/no TLS and sends no SNI, so it cannot get through
#     Cloudflare, and the firewall only accepts 80/443 from Cloudflare ranges.
#   - Keeping terminals on their own port means this surface is exactly one PHP
#     file, with no access to any other endpoint.

server {
    listen 8090;
    listen [::]:8090;
    server_name _;

    root /var/www/permedjat;

    # Terminals send small text payloads; anything large is a mistake or an
    # attack, not a punch batch.
    client_max_body_size 2m;
    client_body_timeout 30s;

    access_log /var/log/nginx/permedjat-devices.access.log;
    error_log  /var/log/nginx/permedjat-devices.error.log;

    # A misbehaving or hostile device must not be able to flood the API's
    # database connections. 30 r/s with a burst covers a room full of terminals
    # pushing in realtime.
    limit_req zone=permedjat_devices burst=60 nodelay;

    # The only routes that exist here. Everything else 404s without touching
    # PHP — this vhost cannot reach the rest of the application.
    location ^~ /iclock/ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/backend/api/device/iclock.php;
        fastcgi_param SCRIPT_NAME /backend/api/device/iclock.php;
        fastcgi_read_timeout 60s;
    }

    location / {
        return 404;
    }
}

# Put this in /etc/nginx/nginx.conf inside the http { } block:
#
#   limit_req_zone $binary_remote_addr zone=permedjat_devices:1m rate=30r/s;

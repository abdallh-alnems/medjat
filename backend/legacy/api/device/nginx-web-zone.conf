# Rate-limit zone for the employee/admin web application (app.permedjatapp.com).
#
# Deploy to /etc/nginx/conf.d/permedjat-web-zone.conf, then add inside the
# `location /` of sites-available/permedjat-web:
#
#     limit_req zone=permedjat_web burst=40 nodelay;
#
# WHY THIS EXISTS
#
# Every browser call from the employee attendance surface reaches the PHP
# backend through the Next.js server-side proxy, because the backend's Basic
# credentials must never be exposed to the page. That means the backend sees the
# *proxy's* address for every employee, so its own per-IP limit is one shared
# bucket: a single misbehaving tab can drain it for the whole company. A React
# effect loop did exactly that during testing — 600 requests a minute from one
# open page.
#
# nginx is the only layer that still sees the real client address (Cloudflare's
# is mapped onto it by conf.d/cloudflare-realip.conf), so coarse flood
# protection belongs here. Per-employee fairness is enforced in the backend on
# the employee id, which cannot be forged after authentication.
#
# The alternative — forwarding a client-IP header and having the backend trust
# it — was rejected deliberately: it invents a trust relationship that one
# misconfiguration turns into a complete bypass.
#
# ON THE RATE
#
# 20 r/s with a burst of 40 is deliberately generous. This limit is per address,
# and an office of forty people behind one NAT appears as a single client, so a
# tight limit here would throttle a whole branch rather than an abuser. The
# precise work is done by the per-employee limit; this is a flood valve.

limit_req_zone $binary_remote_addr zone=permedjat_web:10m rate=20r/s;

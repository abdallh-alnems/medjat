name: permedjat_shared
description: >-
  Face identity pipeline shared by the Permedjat employee app and the branch kiosk.
  Both products must produce byte-identical embeddings, because the server
  matches them against one column.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # Face pipeline. These versions must stay in step with permedjat_app —
  # a different tflite or ML Kit build can change the numbers coming out of
  # the model, and the server would silently stop matching.
  google_mlkit_face_detection: ^0.13.1
  tflite_flutter: ^0.11.0
  image: ^4.3.0

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  assets:
    - assets/models/

name: permedjat_kiosk
description: "Medjat branch kiosk — shared tablet attendance"
publish_to: 'none'
version: 1.0.0+1

environment:
  # Kept in step with medjat_app and medjat_shared.
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Face pipeline + the MobileFaceNet model, shared with medjat_app.
  # The server matches embeddings from both products against one stored vector
  # per employee, so extraction must be identical. One copy, not two.
  permedjat_shared:
    path: ../shared

  # Version constraints deliberately match medjat_app.
  get: ^4.7.2
  http: ^1.2.2
  connectivity_plus: ^6.1.4
  flutter_dotenv: ^5.2.1
  flutter_secure_storage: ^9.2.4
  flutter_screenutil: ^5.9.3

  camera: ^0.11.0+2
  google_mlkit_face_detection: ^0.13.1

  # Device model and Android version, reported once at pairing.
  device_info_plus: ^11.2.0

  # Reports the running version on every heartbeat; the server compares it
  # against medjat_kiosk_min_version and answers 426 when it is too old.
  package_info_plus: ^8.1.2

  cupertino_icons: ^1.0.8

  # Firebase. Versions match medjat_app so one `flutter pub upgrade` moves the
  # whole repo together.
  #
  # The server remains the only authority on whether this tablet may serve
  # people: heartbeat still answers 401/426/503 and nothing below overrides it.
  # What Firebase adds is (a) crash reports from a device nobody is watching,
  # and (b) two ways to learn a switch was flipped without waiting up to two
  # minutes for the next heartbeat.
  firebase_core: ^3.8.0
  # The whole point. A kiosk on a wall crashes to a supervisor who reports
  # "the tablet stopped working" three days later, with no logs and no adb.
  firebase_crashlytics: ^4.3.0
  # Branch/station-level usage only — never anything identifying an employee.
  firebase_analytics: ^11.4.0
  # Data-only messages on `maintenance_medjat_kiosk`. No notification is ever
  # shown: a kiosk must not carry a surface an employee can tap out of.
  firebase_messaging: ^15.2.0
  # Realtime config updates. The kiosk is permanently foregrounded, so
  # onConfigUpdated is a live wire — it is used to re-ask the server at once,
  # not to decide anything on the device.
  firebase_remote_config: ^5.4.0

  # Deliberately ABSENT:
  #
  #   hive              There is no offline queue. Identification requires the
  #                     server, so there is nothing to queue.
  #   google_mobile_ads A shared branch tablet shows nobody's personal content
  #                     and must not carry a surface an employee can tap out of.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env

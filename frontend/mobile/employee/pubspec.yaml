name: permedjat_app
description: "Permedjat Employee App — HR Attendance & Payroll"
publish_to: 'none'
version: 1.0.3+7

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Face pipeline + the MobileFaceNet model, shared with the kiosk app.
  # The server matches embeddings from both products against one stored vector
  # per employee, so extraction must be identical — hence one copy, not two.
  permedjat_shared:
    path: ../shared

  cupertino_icons: ^1.0.8

  get: ^4.7.2

  firebase_core: ^3.8.0
  firebase_messaging: ^15.2.0
  flutter_local_notifications: ^22.0.0
  firebase_analytics: ^11.4.0
  firebase_crashlytics: ^4.3.0
  firebase_remote_config: ^5.4.0
  firebase_app_check: ^0.3.2

  flutter_dotenv: ^5.2.1
  flutter_secure_storage: ^9.2.4
  flutter_screenutil: ^5.9.3
  shared_preferences: ^2.3.4
  get_storage: ^2.1.1

  hive: ^2.2.3
  hive_flutter: ^1.1.0

  http: ^1.2.2
  connectivity_plus: ^6.1.4
  # WiFi check-in (wifi_gps): reads the connected access point's BSSID.
  network_info_plus: ^6.1.3
  geolocator: ^13.0.2
  safe_device: ^1.1.4
  # Device-biometric gate: confirms the person tapping can unlock this handset.
  # Requires MainActivity to extend FlutterFragmentActivity on Android.
  local_auth: ^2.3.0
  permission_handler: ^11.3.1

  image_picker: ^1.1.2
  # Face check-in (face_selfie): camera capture, ML Kit for detection +
  # liveness signals, TFLite for the identity embedding. ML Kit does NOT do
  # face recognition — it only detects and describes faces — so the embedding
  # model is a separate dependency.
  camera: ^0.11.0+2
  google_mlkit_face_detection: ^0.13.1
  tflite_flutter: ^0.11.0
  image: ^4.3.0
  file_picker: ^8.1.6
  mobile_scanner: ^6.0.6
  qr_flutter: ^4.1.0
  country_picker: ^2.0.27
  app_links: ^6.3.3
  lottie: ^3.3.1
  open_filex: ^4.5.0
  path_provider: ^2.1.5
  flutter_pdfview: ^1.4.0
  url_launcher: ^6.3.1
  intl: ^0.20.2
  package_info_plus: ^8.1.3
  in_app_update: ^4.2.5
  upgrader: ^12.3.0
  rate_my_app: ^2.3.2

  google_mobile_ads: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.1

# App icon (Permedjat — pharaonic papyrus, employee). Regenerate: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "branding/icon_master.png"
  adaptive_icon_background: "branding/icon_bg.png"
  adaptive_icon_foreground: "branding/icon_foreground.png"

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/fonts/
    - assets/images/
    - assets/lottie/
    # assets/models/ moved to the permedjat_shared package. Listing it here too
    # would bundle a second 5 MB copy of the model into this APK.

  fonts:
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700

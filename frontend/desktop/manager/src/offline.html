<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>تعذّر الاتصال — Permedjat Central</title>
    <style>
      :root {
        --brand: #0e7c86;
        --brand-dark: #0a5f67;
        --bg: #f9fcfc;
        --fg: #0f1b1d;
        --muted: #5b6b6e;
        --border: #dbe7e8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --brand: #4fc6cc;
          --brand-dark: #3aa9af;
          --bg: #0d1516;
          --fg: #eaf4f4;
          --muted: #93a5a7;
          --border: #1e2c2e;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
        background: var(--bg);
        color: var(--fg);
        font-family: "IBM Plex Sans Arabic", "Geeza Pro", "Segoe UI", system-ui, sans-serif;
      }
      .card {
        width: 100%;
        max-width: 420px;
        text-align: center;
      }
      .mark {
        width: 64px;
        height: 64px;
        margin: 0 auto 24px;
        display: grid;
        place-items: center;
        border-radius: 18px;
        border: 1px solid var(--border);
        background: color-mix(in srgb, var(--brand) 10%, transparent);
      }
      .mark svg { width: 30px; height: 30px; stroke: var(--brand); }
      h1 { margin: 0 0 10px; font-size: 20px; font-weight: 600; }
      p { margin: 0 0 28px; font-size: 14.5px; line-height: 1.7; color: var(--muted); }
      button {
        font: inherit;
        font-weight: 600;
        font-size: 14.5px;
        color: #fff;
        background: var(--brand);
        border: 0;
        border-radius: 10px;
        padding: 11px 30px;
        cursor: pointer;
        transition: background 0.15s ease;
      }
      button:hover { background: var(--brand-dark); }
      button:disabled { opacity: 0.6; cursor: default; }
      .code {
        margin-top: 26px;
        font-size: 11.5px;
        color: var(--muted);
        opacity: 0.75;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        direction: ltr;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 1l22 22" />
          <path d="M16.7 16.7A10.9 10.9 0 0 1 12 18" />
          <path d="M5 12.5a10 10 0 0 1 4-2.4" />
          <path d="M2 8.8a16 16 0 0 1 4.6-2.9" />
          <path d="M10.7 5.1A16 16 0 0 1 22 8.8" />
          <path d="M12 21h.01" />
        </svg>
      </div>
      <h1>تعذّر الوصول إلى الخادم</h1>
      <p>
        تأكد من اتصالك بالإنترنت ثم أعد المحاولة. إذا استمرت المشكلة فقد يكون
        الخادم تحت الصيانة — جرّب بعد قليل.
      </p>
      <button id="retry" type="button">إعادة المحاولة</button>
      <div class="code" id="code"></div>
    </main>

    <script>
      const params = new URLSearchParams(location.search);
      const code = params.get("code");
      if (code) {
        document.getElementById("code").textContent = "error " + code;
      }

      const button = document.getElementById("retry");
      button.addEventListener("click", () => {
        button.disabled = true;
        button.textContent = "جارٍ المحاولة…";
        window.permedjat?.retry();
        setTimeout(() => {
          button.disabled = false;
          button.textContent = "إعادة المحاولة";
        }, 4000);
      });
    </script>
  </body>
</html>

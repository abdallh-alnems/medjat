name: api

# The gates that make the migration safe. The old backend has 36k lines, no
# static analysis and five hand-run scripts; the whole point of moving is to not
# arrive at the same place, so these run on every push from the first commit
# rather than being retrofitted once the codebase is too big to fix.
#
# The path filter is load-bearing and silent when wrong: a filter that matches
# nothing does not fail the run, it simply never starts one. This workflow was
# dark for several commits after the directories were renamed, which is exactly
# how a green repository stops meaning anything.

on:
  push:
    paths:
      - 'backend/api/**'
      - '.github/workflows/api.yml'
  pull_request:
    paths:
      - 'backend/api/**'

defaults:
  run:
    working-directory: backend/api

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      mysql:
        # Matches production (MySQL 8.4). The schema is owned by the old
        # backend's migration ledger, so CI loads its generated snapshot instead
        # of running Laravel migrations.
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: medjat_laravel_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          # Production runs 8.5; 8.4 is the floor local development uses, so
          # both are exercised rather than assumed compatible.
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, gd, zip, bcmath
          coverage: none

      - name: Cache composer packages
        uses: actions/cache@v4
        with:
          path: backend/api/vendor
          key: composer-${{ hashFiles('backend/api/composer.lock') }}

      - run: composer install --prefer-dist --no-interaction --no-progress

      - name: Load the production schema snapshot
        run: mysql -h 127.0.0.1 -P 3306 -uroot -proot medjat_laravel_test < ../legacy/database/migrations/schema.sql

      - run: cp .env.example .env && php artisan key:generate

      - name: Point the test environment at the service container
        run: |
          sed -i 's/^DB_PORT=.*/DB_PORT=3306/' .env.testing

      - name: Code style
        run: vendor/bin/pint --test

      - name: Static analysis
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Tests
        run: php artisan test
